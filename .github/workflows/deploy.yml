name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  # The evals workflow commits regenerated dashboard data using GITHUB_TOKEN,
  # and a GITHUB_TOKEN push does not itself trigger other workflows. So also
  # deploy whenever Evals finishes: this run checks out main (including that
  # fresh commit) and republishes the real numbers.
  workflow_run:
    workflows: ["Evals"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
